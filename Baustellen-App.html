<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Baustellen-Zentrale</title>
<style>
  :root{
    --bg:#eef2f6; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --primary:#0284c7; --primary-d:#0369a1; --accent:#16a34a; --accent-l:#dcfce7;
    --danger:#dc2626; --danger-l:#fee2e2; --warn:#d97706; --warn-l:#fef3c7;
    --neutral:#94a3b8; --shadow:0 1px 3px rgba(15,23,42,.08),0 8px 24px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  .hide{display:none!important}
  .wrap{max-width:1200px;margin:0 auto;padding:0 16px 60px}

  /* Passcode-Gate */
  .gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
  .gate-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px;width:100%;max-width:360px;text-align:center}
  .gate-card .glogo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#0284c7,#16a34a);display:grid;place-items:center;color:#fff;margin:0 auto 14px}
  .gate-card h1{font-size:20px;margin:0 0 4px}
  .gate-card p{color:var(--muted);font-size:14px;margin:0 0 18px}
  .code-in{width:100%;text-align:center;font-size:22px;letter-spacing:6px;font-weight:700;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
  .gate-btn{border:1px solid var(--primary);background:var(--primary);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;font-size:15px;width:100%}
  .gate-err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}

  /* Header */
  header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  .top-in{max-width:1200px;margin:0 auto;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.2px}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0284c7,#16a34a);display:grid;place-items:center;color:#fff;flex:none}
  .brand .logo-img{height:26px;width:auto;display:block;flex:none}
  .brand .appdiv{padding-left:11px;margin-left:1px;border-left:1px solid var(--line);font-size:15px}
  .gate-logo-img{height:30px;width:auto;margin:0 auto 16px;display:block}
  .card.done{opacity:.62}
  .emp-sep{grid-column:1/-1;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:10px 0 2px}
  .emp-sep::before,.emp-sep::after{content:"";flex:1;height:1px;background:#d7dee7}
  .spacer{flex:1}
  .badge-role{font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;letter-spacing:.3px}
  .badge-role.adm{background:#ede9fe;color:#6d28d9}
  .badge-role.mit{background:var(--accent-l);color:#166534}
  .iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--muted);flex:none}
  .iconbtn:active{background:#f1f5f9}
  .iconbtn svg{width:18px;height:18px}
  .role{display:flex;background:#f1f5f9;border:1px solid var(--line);border-radius:999px;padding:3px}
  .role button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
  .role button.active{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .role button.active[data-r="buero"]{color:var(--primary-d)}
  .role button.active[data-r="mitarbeiter"]{color:var(--accent)}

  /* Board */
  .page-h{display:flex;align-items:baseline;gap:12px;margin:22px 0 6px;flex-wrap:wrap}
  .page-h h1{font-size:22px;margin:0;letter-spacing:-.4px}
  .page-h .sub{color:var(--muted);font-size:14px}
  .search{margin-left:auto;align-self:center;position:relative;display:flex;align-items:center}
  .search-ic{position:absolute;left:11px;width:16px;height:16px;color:var(--muted);pointer-events:none}
  .search input{padding:9px 30px 9px 34px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;width:230px;background:var(--panel);color:var(--ink);-webkit-appearance:none}
  .search input:focus{outline:none;border-color:var(--primary)}
  .search input::-webkit-search-cancel-button{display:none}
  .search-clear{position:absolute;right:6px;border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 6px;border-radius:6px;line-height:1}
  .search-clear:hover{background:#f1f5f9}
  .res-head{color:var(--muted);font-size:13px;font-weight:600;margin:16px 0 0}
  @media(max-width:560px){ .search{width:100%;margin:10px 0 0} .search input{width:100%} }
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:#cbd5e1}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-d)}
  .btn.green{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn svg{width:16px;height:16px}

  .board{display:grid;grid-template-columns:repeat(6,minmax(215px,1fr));gap:14px;margin-top:16px;overflow-x:auto;padding-bottom:8px}
  .col{background:#e9eef4;border-radius:14px;padding:10px;min-height:120px}
  .col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:700;font-size:13px;color:#475569}
  .col-h .dot{width:9px;height:9px;border-radius:50%}
  .col-h .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:12px;border-radius:999px;padding:1px 8px;font-weight:700}
  .col-search{position:relative;display:flex;align-items:center;margin:0 2px 10px}
  .col-search .search-ic{position:absolute;left:9px;width:14px;height:14px;color:var(--muted);pointer-events:none}
  .col-search input{width:100%;padding:7px 26px 7px 29px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;background:var(--panel);color:var(--ink);-webkit-appearance:none;box-sizing:border-box}
  .col-search input:focus{outline:none;border-color:var(--primary)}
  .col-search input::-webkit-search-cancel-button{display:none}
  .col-search .search-clear{position:absolute;right:4px;border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;padding:3px 5px;border-radius:6px;line-height:1}
  .col-search .search-clear:hover{background:#f1f5f9}
  .col-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:10px 4px}
  .emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,23,42,.05);transition:transform .08s,box-shadow .12s}
  .emp-grid .card{margin-bottom:0}
  .card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .card h3{margin:0 0 3px;font-size:15px;letter-spacing:-.2px}
  .card .addr{color:var(--muted);font-size:12.5px;margin-bottom:9px;line-height:1.35}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .chip.crm{background:#ede9fe;color:#6d28d9}
  .chip.plan{background:#e0f2fe;color:#075985}
  .chip.rel{background:#dcfce7;color:#166534}
  .chip.ok{background:var(--accent-l);color:#166534}
  .chip.bad{background:var(--danger-l);color:#991b1b}
  .chip.pack{background:#f1f5f9;color:#475569}
  .chip.warn{background:var(--warn-l);color:#92400e}
  .pk.big{width:30px;height:30px}
  .stk{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .foto-btn{margin-top:14px;width:100%;border:1px solid var(--line);background:#f8fafc;color:var(--muted);font-weight:800;font-size:16px;padding:14px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px}
  .foto-btn.ready{border-color:var(--accent);background:#f0fdf4;color:#166534}
  .foto-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .foto-btn:disabled{opacity:.55}
  .chip svg{width:12px;height:12px}
  .card .bar{height:6px;background:#eef2f6;border-radius:4px;margin-top:10px;overflow:hidden}
  .card .bar > i{display:block;height:100%;background:var(--accent)}
  .card{position:relative}
.card-del{position:absolute;top:8px;right:8px;width:26px;height:26px;border:1px solid #fecaca;background:#fef2f2;color:#dc2626;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;line-height:1;display:grid;place-items:center;padding:0}
.card-del:hover{background:#fee2e2}
.freigabe-btn{margin-top:10px;width:100%;border:1px solid var(--line);background:#f8fafc;color:var(--muted);font-weight:700;font-size:12.5px;padding:7px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px}
  .freigabe-btn:hover{border-color:#a78bfa;color:#6d28d9}
  .freigabe-btn.on{background:var(--accent-l);border-color:#86efac;color:#166534}

  /* Detail */
  .detail{display:none}
  .back{background:transparent;border:0;color:var(--primary-d);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;padding:14px 2px}
  .d-head{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
  .d-head .row1{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .d-head h2{margin:0;font-size:21px;letter-spacing:-.3px}
  .d-head .addr{color:var(--muted);font-size:14px;margin-top:3px}
  .d-head .addr a{color:var(--primary-d);text-decoration:none;font-weight:600}
  .d-head .addr a:hover{text-decoration:underline}
  .d-head .status-sel{margin-left:auto;display:flex;align-items:center;gap:8px}
  select{font-family:inherit;font-size:13.5px;font-weight:600;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .fr-toggle{margin-top:14px;border:1px solid #a78bfa;background:#f5f3ff;color:#6d28d9;font-weight:700;font-size:14px;padding:10px 16px;border-radius:11px;display:inline-flex;align-items:center;gap:8px;width:100%;justify-content:center}
  .fr-toggle.on{background:var(--accent-l);border-color:#86efac;color:#166534}
  .fr-toggle svg{width:17px;height:17px}
  .grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-top:14px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
  .box h4{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}

  .drop{border:2px dashed #cbd5e1;border-radius:12px;padding:18px;text-align:center;color:var(--muted);background:#f8fafc}
  .drop b{color:var(--ink)}
  .plan-file{display:flex;align-items:center;gap:12px}
  .plan-file .thumb{width:54px;height:54px;border-radius:10px;background:#e0f2fe;display:grid;place-items:center;color:#075985;flex:none;overflow:hidden}
  .plan-file .thumb img{width:100%;height:100%;object-fit:cover}
  .plan-file .meta{flex:1;min-width:0}
  .plan-file .meta .n{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plan-file .meta .s{color:var(--muted);font-size:12.5px}
  .plan-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{border:1px solid var(--line);border-radius:12px;padding:12px;background:#f8fafc}
  .tile .k{font-size:12px;color:var(--muted);font-weight:600}
  .tile .v{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
  .tile .v small{font-size:13px;color:var(--muted);font-weight:600}
  .tile.good .v{color:var(--accent)}
  .tile.bad .v{color:var(--danger)}
  .prog{height:8px;background:#eef2f6;border-radius:5px;overflow:hidden;margin-top:10px}
  .prog > i{display:block;height:100%;background:var(--accent);transition:width .2s}

  .tbl-wrap{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .tbl-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tbl-head h4{margin:0;font-size:15px}
  .legend{display:flex;gap:14px;margin-left:auto;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:12px;height:12px;border-radius:4px;display:inline-block}
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{background:#f8fafc;text-align:center;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:11px 8px;border-bottom:1px solid var(--line);position:sticky;top:0}
  thead th.mat{text-align:left;padding-left:16px}
  tbody td{padding:8px;border-bottom:1px solid #f1f5f9;text-align:center;vertical-align:middle}
  tbody td.mat{text-align:left;padding-left:16px;font-weight:600}
  tbody tr:hover{background:#f8fafc}
  tbody tr.off{opacity:.5}
  .cell-in{width:64px;text-align:center;font-size:14px;font-weight:700;padding:7px 4px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .cell-in:disabled{background:#f1f5f9;color:#94a3b8;font-weight:600;border-color:transparent}
  .cell-in.ben{color:var(--primary-d)}
  .cell-in::placeholder{color:#cbd5e1;font-weight:600;font-style:italic}
  .div-badge{display:inline-block;min-width:44px;padding:6px 10px;border-radius:8px;font-weight:800;font-size:14px}
  .div-badge.ok{background:var(--accent-l);color:#166534}
  .div-badge.bad{background:var(--danger-l);color:#991b1b}
  .div-badge.neutral{background:#f1f5f9;color:var(--neutral)}
  .pk{width:22px;height:22px;accent-color:var(--accent);cursor:pointer}
  .pk:disabled{cursor:not-allowed;opacity:.5}

  .hint{font-size:12.5px;color:var(--muted);padding:12px 16px;background:#f8fafc;border-top:1px solid var(--line)}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px}
  .empty .big{font-size:34px;margin-bottom:10px}

  .center{min-height:55dvh;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
  .spin{width:34px;height:34px;border:3px solid #cbd5e1;border-top-color:var(--primary);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}
  @keyframes s{to{transform:rotate(360deg)}}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);transition:.25s;z-index:60;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.bad{background:var(--danger)}
  .pop{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;min-width:190px}
  .pop button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink);text-align:left}
  .pop button:hover{background:#f1f5f9}
  .pop .wa{color:#25D366}

  /* ===== Montageplan (Dachflächen-Zeichnung für den Monteur) ===== */
  .mp-sec{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}
  .mp-kopf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .mp-kopf h4{margin:0;font-size:15px;flex:1}
  .mp-warn{background:#fee2e2;border:2px solid #dc2626;color:#991b1b;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:16px;font-weight:700;line-height:1.45}
  .mp-warn ul{margin:6px 0 0 18px;padding:0;font-size:15px}
  .mp-info{background:#e0f2fe;border:1px solid #7dd3fc;color:#075985;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14.5px;font-weight:600}
  .mp-ok{background:#dcfce7;border:1px solid #86efac;color:#166534}
  .mp-regeln{background:#f0fdf4;border:1px solid #86efac;color:#14532d;font-weight:700}
  .mp-regeln ul{margin:6px 0 0 18px;padding:0;font-weight:500}
  .mp-gelb{background:#fef3c7;border:1px solid #f59e0b;color:#92400e;border-radius:8px;padding:6px 10px;margin:6px 0 0;font-weight:600}
  .mp-dach{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
  .mp-dach h5{flex:1 1 100%;margin:0;font-size:17px;color:var(--ink)}
  .mp-zeichnung{flex:3 1 480px;min-width:0;border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px}
  .mp-zeichnung svg{display:block;width:100%;height:auto}
  .mp-liste{flex:1 1 300px;min-width:0}
  .mp-tab{width:100%;border-collapse:collapse;font-size:14.5px}
  .mp-tab th{text-align:left;font-size:12px;color:var(--muted);border-bottom:2px solid var(--line);padding:6px 4px}
  .mp-tab td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
  .mp-fb{display:inline-block;width:22px;height:12px;border-radius:3px;vertical-align:middle;border:1px solid rgba(0,0,0,.15)}
  .mp-punkt{display:inline-block;width:12px;height:12px;border-radius:50%;background:#0f172a;vertical-align:middle}
  .mp-n{font-weight:800;font-size:18px}
  .mp-schnitt{color:#dc2626;font-weight:800}
  .mp-zs{margin:10px 0 0;padding:0;list-style:none;font-size:14.5px}
  .mp-zs li{padding:6px 0;border-bottom:1px dashed var(--line)}
  .mp-hinweis{font-size:13.5px;color:#334155;margin-top:8px}
  .mp-kontrolle{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:10px 0}
  .mp-kontrolle label{display:flex;flex-direction:column;font-size:12.5px;font-weight:700;color:var(--muted);gap:3px}
  .mp-kontrolle input,.mp-kontrolle select{font-size:15px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;font-family:inherit}
  .mp-kontrolle input.mp-reihen{width:150px;font-weight:800}
  .mp-vorschau img{max-width:100%;max-height:320px;border:1px solid var(--line);border-radius:8px;margin-top:6px}
  @media(max-width:760px){ .mp-zeichnung,.mp-liste{flex:1 1 100%} }
  @media(max-width:820px){ .grid2{grid-template-columns:1fr} .role button{padding:7px 10px} .brand span.full{display:none} }
.at-link{display:inline-flex;align-items:center;gap:7px;margin-top:10px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;text-decoration:none}
.at-link:active{opacity:.7}
</style>
</head>
<body>

<!-- Login-Gate -->
<div id="gate" class="gate">
  <div class="gate-card">
    <img class="gate-logo-img" src="https://www.syrink.de/cdn/shop/files/Asset_4.png?width=320" alt="Syrink Solar" onerror="this.style.display='none';document.getElementById('gateFallback').style.display='grid'">
    <div class="glogo" id="gateFallback" style="display:none"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1l2.1-2.1M17 7l2.1-2.1"/></svg></div>
    <h1>Baustellen-Zentrale</h1>
    <p>Bitte Zugangscode eingeben</p>
    <input id="codeIn" class="code-in" type="tel" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off">
    <button class="gate-btn" id="codeBtn">Anmelden</button>

        <span class="logo" id="brandFallback" style="display:none"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1l2.1-2.1M17 7l2.1-2.1"/></svg></span>

  <button data-a="copy"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Link kopieren</button>
</div>

<script>
/* ===== KONFIG (mit Make verbunden) ===== */
const CONFIG = {
  GET_URL:  "https://hook.eu2.make.com/9gj1j5y1ep3zfgyww8mj60pon4lbuhfd",
  SAVE_URL: "https://hook.eu2.make.com/uf4gr5b22a0x9sdpdp4nv5lpbjp475qn",
  PLAN_URL: "https://hook.eu2.make.com/rh4trtwbt6iti8efl5tseygomjs7j917",
  DEL_URL:  "https://hook.eu2.make.com/lph662moo1sopvj5k9u96b0w1gulb9qc",
  MAT_URL:  "https://hook.eu2.make.com/9xmi0l3c0gxomg261wqvc9mr1njt1zja",   // Make 9914877: Materialliste aus dem PV-Konfigurator (liste / ersetzen)
  MAT_KEY:  "mlk7syrink",
  KATALOG_URL: "https://hook.eu2.make.com/4jc0nue3i98jesk3xvh6gl1xlscqw7gv",   // PV-Katalog (Make 9800213) – Modulmaße für den Montageplan
  CODE_ADMIN: "7894",   // voller Zugriff
  CODE_MIT:   "1234"    // nur freigegebene Kunden
};
const F = {
  siteName:["Name"], siteAddr:["Adresse"], siteStatus:["Status"], siteDate:["Termin"],
  sitePlan:["Belegungsplan"], siteDeal:["HubSpot Deal ID"], siteFrei:["Freigabe Mitarbeiter"], siteFoto:["Foto bestaetigt"],
  mArtikel:["Artikel"], mSite:["Baustelle"], mBen:["Benoetigt","Benötigt"],
  mOut:["Outbound"], mIn:["Inbound"], mGepackt:["Gepackt"]
};
const COLUMNS = [
  ["Neu aus CRM","Neu aus CRM","#8b5cf6"],
  ["Planung Buero","Planung Büro","#0284c7"],
  ["Bereit gepackt","Bereit / gepackt","#0891b2"],
  ["Auf Baustelle","Auf Baustelle","#d97706"],
  ["Abgeschlossen","Abgeschlossen","#16a34a"],
  ["","Ohne Status","#cbd5e1"]
];
const KNOWN = new Set(COLUMNS.map(c=>c[0]).filter(Boolean));

/* ===== Helpers ===== */
const $=s=>document.querySelector(s);
function recs(x){ if(!x) return []; if(Array.isArray(x)) return x; if(Array.isArray(x.records)) return x.records; return []; }
function fv(rec,keys,def){ const f=(rec&&rec.fields)||rec||{}; for(const k of keys){ if(f[k]!==undefined&&f[k]!==null) return f[k]; } return def; }
function nz(v){ return v===""||v===null||v===undefined?"":Number(v); }
function buf(b){ return Math.max(2,Math.round(b*0.15)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(t,bad){ const el=$("#toast"); el.textContent=t; el.className="toast show"+(bad?" bad":""); clearTimeout(el._t); el._t=setTimeout(()=>el.className="toast",2200); }
function beacon(u){ const f=document.createElement("iframe"); f.style.cssText="display:none"; f.src=u; document.body.appendChild(f); setTimeout(()=>{if(f.parentNode)f.parentNode.removeChild(f);},8000); }
function mapsUrl(addr){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(addr); }

let state={ access:null, role:"mitarbeiter", openId:null, customers:[], search:"", colSearch:{} };
function matchesQuery(c,q){ q=(q||"").trim().toLowerCase(); if(!q) return true; return (c.name||"").toLowerCase().includes(q) || (c.address||"").toLowerCase().includes(q); }

/* ===== Daten laden ===== */
function buildCustomers(sites,materials){
  return sites.map(s=>{
    const mats=materials.filter(m=>{
      const link=fv(m,F.mSite,[]); const ids=Array.isArray(link)?link.map(x=>x&&x.id?x.id:x):[link];
      return ids.indexOf(s.id)>=0;
    }).map(m=>({ recId:m.id, name:fv(m,F.mArtikel,""), benoetigt:nz(fv(m,F.mBen,"")), outbound:nz(fv(m,F.mOut,"")), inbound:nz(fv(m,F.mIn,"")), gepackt:!!fv(m,F.mGepackt,false) }));
    const bp=fv(s,F.sitePlan,[]);
    const plan=bp.length?{ name:bp[0].filename||"Belegungsplan", url:bp[0].url||null }:null;
    let st=fv(s,F.siteStatus,""); if(!KNOWN.has(st)) st="";
    return { id:s.id, name:fv(s,F.siteName,"(ohne Name)"), address:fv(s,F.siteAddr,""), date:fv(s,F.siteDate,""), status:st, crm:!!fv(s,F.siteDeal,""), released:!!fv(s,F.siteFrei,false), fotoOk:!!fv(s,F.siteFoto,false), plan, materials:mats };
  });
}
async function fetchAll(){
  if(window.__DATA__){ const d=window.__DATA__; return {sites:recs(d.sites), materials:recs(d.materials)}; }
  const scoped = state.access==="mit";
  let sites=null, materials=[], off="";
  for(let i=0;i<60;i++){
    const p=[]; if(scoped)p.push("scope=mit"); if(off)p.push("offset="+encodeURIComponent(off));
    const url=CONFIG.GET_URL+(p.length?"?"+p.join("&"):"");
    const r=await fetch(url,{cache:"no-store"});
    const d=await r.json();
    if(!sites) sites=recs(d.sites);
    materials=materials.concat(recs(d.materials));
    off=(d.materials&&d.materials.offset)?d.materials.offset:"";
    if(!off) break;
  }
  return {sites, materials};
}
async function load(){
  state.openId=null; $("#detail").style.display="none"; $("#dashboard").classList.add("hide");
  $("#errbox").classList.add("hide"); $("#loading").classList.remove("hide");
  try{
    const {sites,materials}=await fetchAll();
    state.customers=buildCustomers(sites,materials);
    $("#loading").classList.add("hide"); $("#dashboard").classList.remove("hide"); renderDashboard();
  }catch(e){
    $("#loading").classList.add("hide");
    $("#errbox").classList.remove("hide");
    $("#errbox").innerHTML='<div><div style="font-size:30px">⚠️</div><div style="margin:8px 0 14px">Daten konnten nicht geladen werden.</div><button class="btn primary" onclick="load()">Erneut versuchen</button></div>';
  }
}

/* ===== Logik ===== */
function divInfo(m){
  const has=(m.outbound!==""&&m.outbound!=null)||(m.inbound!==""&&m.inbound!=null);
  if(!has) return {text:"—",cls:"neutral"};
  const d=(Number(m.outbound)||0)-(Number(m.inbound)||0);
  const ok=m.benoetigt!==""&&m.benoetigt!=null&&d===Number(m.benoetigt);
  return {text:d,cls:ok?"ok":"bad"};
}
function relevant(m){ return (m.benoetigt!==""&&m.benoetigt>0)||(m.outbound!==""&&m.outbound>0); }
function stats(c){ let rel=0,packed=0,dev=0; c.materials.forEach(m=>{ if(relevant(m)){rel++; if(m.gepackt)packed++;} if(divInfo(m).cls==="bad")dev++; }); return {rel,packed,dev}; }

/* ===== Karten ===== */
function makeCard(c){
  const s=stats(c); const pct=s.rel?Math.round(s.packed/s.rel*100):0;
  let chips="";
  if(state.access==="admin"&&c.crm) chips+='<span class="chip crm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>aus CRM</span>';
  if(c.plan) chips+='<span class="chip plan">Plan ✓</span>';
  if(state.access==="admin"&&c.released) chips+='<span class="chip rel">freigegeben</span>';
  if(s.dev>0) chips+='<span class="chip bad">'+s.dev+' Abw.</span>';
  else if(s.rel>0&&s.packed===s.rel) chips+='<span class="chip ok">stimmt</span>';
  if(s.rel>0) chips+='<span class="chip pack">'+s.packed+'/'+s.rel+' gepackt</span>';
  if(s.rel>0&&s.packed===s.rel) chips+= c.fotoOk?'<span class="chip ok">Foto ✓</span>':'<span class="chip warn">Foto fehlt</span>';
  const card=document.createElement("div"); card.className="card";
  card.innerHTML='<h3>'+esc(c.name)+'</h3><div class="addr">'+esc(c.address)+'</div><div class="chips">'+chips+'</div>'+(s.rel?'<div class="bar"><i style="width:'+pct+'%"></i></div>':'');
  if(state.access==="admin"){
    const fb=document.createElement("button"); fb.className="freigabe-btn"+(c.released?" on":"");
    fb.innerHTML=(c.released?'✓ Freigegeben':'Für Mitarbeiter freigeben');
    fb.onclick=(e)=>{ e.stopPropagation(); toggleFreigabe(c); };
    card.appendChild(fb);
  }
  if(state.access==="admin"&&c.status==="Neu aus CRM"){
    const xb=document.createElement("button"); xb.className="card-del"; xb.title="Karte löschen"; xb.textContent="✕";
    xb.onclick=(e)=>{ e.stopPropagation();
      if(!confirm('Karte "'+c.name+'" wirklich löschen?\nKarte und Materialliste werden entfernt. Das kann nicht rückgängig gemacht werden.')) return;
      beacon(CONFIG.DEL_URL+"?id="+encodeURIComponent(c.id)+"&mats="+encodeURIComponent((c.materials||[]).map(m=>m.recId).join(",")));
      state.customers=state.customers.filter(x=>x.id!==c.id);
      renderDashboard(); toast("Karte gelöscht");
    };
    card.appendChild(xb);
  }
  card.onclick=()=>openDetail(c.id);
  return card;
}

/* ===== Dashboard ===== */
function renderDashboard(){
  const q=(state.search||"").trim();
  if(q){ renderResults(q); return; }
  if(state.access==="admin") renderBoard(); else renderEmployee();
}
function renderResults(q){
  const board=$("#board"); board.className=""; board.innerHTML="";
  const list=state.customers.filter(c=>matchesQuery(c,q));
  const head=document.createElement("div"); head.className="res-head"; head.textContent=list.length+" Treffer für „"+q+"“";
  board.appendChild(head);
  if(!list.length){ const e=document.createElement("div"); e.className="empty"; e.innerHTML='<div class="big">🔍</div>Kein Kunde gefunden.'; board.appendChild(e); return; }
  const grid=document.createElement("div"); grid.className="emp-grid"; grid.style.marginTop="12px";
  list.forEach(c=>grid.appendChild(makeCard(c)));
  board.appendChild(grid);
}

/* Spalten mit eigener Suchleiste */
const SEARCH_COLS = new Set(["Neu aus CRM"]);

function addColSearch(col,key,list,cnt){
  const wrap=document.createElement("div"); wrap.className="col-search";
  wrap.innerHTML='<svg class="search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'
    +'<input type="search" placeholder="In dieser Spalte suchen …" autocomplete="off">'
    +'<button class="search-clear hide" title="Löschen" type="button">✕</button>';
  const inp=wrap.querySelector("input"), clr=wrap.querySelector("button");
  const empty=document.createElement("div"); empty.className="col-empty hide"; empty.textContent="Kein Treffer";
  const apply=()=>{
    const q=(state.colSearch[key]||"").trim();
    let hits=0;
    list.forEach(o=>{ const ok=matchesQuery(o.c,q); o.el.style.display=ok?"":"none"; if(ok)hits++; });
    cnt.textContent=q?hits+"/"+list.length:list.length;
    empty.classList.toggle("hide",hits>0);
    clr.classList.toggle("hide",!q);
  };
  inp.value=state.colSearch[key]||"";
  inp.addEventListener("input",e=>{ state.colSearch[key]=e.target.value; apply(); });
  inp.addEventListener("keydown",e=>{ if(e.key==="Escape"){ state.colSearch[key]=""; inp.value=""; apply(); } });
  clr.onclick=()=>{ state.colSearch[key]=""; inp.value=""; apply(); inp.focus(); };
  col.appendChild(wrap);
  return {apply,inp,empty};
}

function renderBoard(){
  const board=$("#board"); board.className="board"; board.innerHTML="";
  const active=document.activeElement;
  const refocus=active&&active.closest&&active.closest(".col-search")?active.value:null;
  COLUMNS.forEach(([key,label,color])=>{
    const list=state.customers.filter(c=>c.status===key);
    const col=document.createElement("div"); col.className="col";
    col.innerHTML='<div class="col-h"><span class="dot" style="background:'+color+'"></span>'+label+'<span class="cnt">'+list.length+'</span></div>';
    const cnt=col.querySelector(".cnt");
    const cards=list.map(c=>({c,el:makeCard(c)}));
    let sb=null;
    if(SEARCH_COLS.has(key)) sb=addColSearch(col,key,cards,cnt);
    cards.forEach(o=>col.appendChild(o.el));
    if(sb){ col.appendChild(sb.empty); sb.apply(); if(refocus!==null&&refocus===sb.inp.value){ sb.inp.focus(); } }
    board.appendChild(col);
  });
}
function fullyPacked(c){ const s=stats(c); return s.rel>0 && s.packed===s.rel; }
function renderEmployee(){
  const board=$("#board"); board.className=""; board.innerHTML="";
  const all=state.customers.slice();
  if(!all.length){ board.innerHTML='<div class="empty"><div class="big">📭</div>Aktuell ist nichts für dich freigegeben.<br><span style="font-size:13px">Sobald dein Chef eine Baustelle freigibt, erscheint sie hier.</span></div>'; return; }
  const isDone=c=>fullyPacked(c)&&c.fotoOk;
  const todo=all.filter(c=>!isDone(c)), done=all.filter(isDone);
  const grid=document.createElement("div"); grid.className="emp-grid";
  todo.forEach(c=>grid.appendChild(makeCard(c)));
  if(done.length){
    const sep=document.createElement("div"); sep.className="emp-sep"; sep.textContent="Fertig gepackt"; grid.appendChild(sep);
    done.forEach(c=>{ const card=makeCard(c); card.classList.add("done"); grid.appendChild(card); });
  }
  board.appendChild(grid);
}

/* ===== Detail ===== */
function openDetail(id){ state.openId=id; $("#dashboard").classList.add("hide"); $("#detail").style.display="block"; renderDetail(); window.scrollTo(0,0); }
function renderDetail(){
  const c=state.customers.find(x=>x.id===state.openId); if(!c) return;
  const admin=state.access==="admin";
  const isBuero=admin && state.role==="buero";
  const s=stats(c); const pct=s.rel?Math.round(s.packed/s.rel*100):0;

  let planHtml;
  if(c.plan){
    const thumb=c.plan.url?'<img src="'+c.plan.url+'" alt="">':'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
    planHtml='<div class="plan-file"><div class="thumb">'+thumb+'</div><div class="meta"><div class="n">'+esc(c.plan.name)+'</div><div class="s">Belegungsplan · für die Baustelle</div></div></div>'
      +'<div class="plan-actions"><a class="btn" href="'+CONFIG.PLAN_URL+"?b="+encodeURIComponent(c.id)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Öffnen</a>'
      +'<button class="btn green" id="shareBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>Teilen</button></div>';
  } else {
    planHtml='<div class="drop"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><div style="margin-top:8px">Noch kein Belegungsplan.<br><span style="font-size:12.5px">'+(admin?'Über den blauen Airtable-Link oben hochladen (Feld „Belegungsplan").':'Frag im Büro nach dem Belegungsplan.')+'</span></div></div>';
  }

  const simple=!isBuero;
  let rows,theadHtml;
  if(simple){
    rows=c.materials.map((m,i)=>{
      const sug=(m.benoetigt!==""&&m.benoetigt>0)?(Number(m.benoetigt)+buf(Number(m.benoetigt))):"";
      const off=!relevant(m)?"off":"";
      return '<tr class="'+off+'">'
        +'<td class="mat" style="font-size:15px">'+esc(m.name)+'</td>'
        +'<td><span class="stk">'+(m.benoetigt===""?"–":m.benoetigt)+'</span></td>'
        +'<td><input class="cell-in" type="number" min="0" inputmode="numeric" value="'+m.outbound+'" data-i="'+i+'" data-f="outbound" placeholder="'+(sug?"≈ "+sug:"–")+'"></td>'
        +'<td><input class="cell-in" type="number" min="0" inputmode="numeric" value="'+m.inbound+'" data-i="'+i+'" data-f="inbound" placeholder="–"></td>'
        +'<td><input class="pk big" type="checkbox" '+(m.gepackt?"checked":"")+' data-i="'+i+'" data-f="gepackt"></td>'
        +'</tr>';
    }).join("");
    if(!rows) rows='<tr><td colspan="5" style="padding:26px;text-align:center;color:var(--muted)">Noch keine Materialliste vom Büro.</td></tr>';
    theadHtml='<tr><th class="mat">Material</th><th>Stückzahl</th><th>Raus</th><th>Zurück</th><th>Gepackt</th></tr>';
  } else {
  rows=c.materials.map((m,i)=>{
    const d=divInfo(m);
    const sug=(m.benoetigt!==""&&m.benoetigt>0)?(Number(m.benoetigt)+buf(Number(m.benoetigt))):"";
    const off=!relevant(m)?"off":"";
    return '<tr class="'+off+'">'
      +'<td class="mat">'+esc(m.name)+'</td>'
      +'<td><input class="cell-in ben" type="number" min="0" inputmode="numeric" value="'+m.benoetigt+'" '+(isBuero?"":"disabled")+' data-i="'+i+'" data-f="benoetigt" placeholder="–"></td>'
      +'<td><input class="cell-in" type="number" min="0" inputmode="numeric" value="'+m.outbound+'" '+(isBuero?"disabled":"")+' data-i="'+i+'" data-f="outbound" placeholder="'+(sug?"≈ "+sug:"")+'"></td>'
      +'<td><input class="cell-in" type="number" min="0" inputmode="numeric" value="'+m.inbound+'" '+(isBuero?"disabled":"")+' data-i="'+i+'" data-f="inbound" placeholder="–"></td>'
      +'<td><span class="div-badge '+d.cls+'">'+d.text+'</span></td>'
      +'<td><input class="pk" type="checkbox" '+(m.gepackt?"checked":"")+' '+(isBuero?"disabled":"")+' data-i="'+i+'" data-f="gepackt"></td>'

/* ===== Materialliste aus dem PV-Konfigurator (ab v21) neu übernehmen =====
   Liest die im Angebot gespeicherte Materialliste (Datastore 185541, über baustelleId) und ersetzt NUR die
   noch nicht gepackten Zeilen dieser Artikel. Bereits gepackte Mengen werden abgezogen, damit nichts doppelt
   ausgebucht wird. Gebucht wird hier nichts – das macht „Lager Auto-Ausbuchen“ beim Packen. */
const MAT_ARTIKEL = ["Schiene 5,85m","Schiene 4,75m","Schiene 3,6m","Schiene 2,4m","Innenverbinder","Mittelklemmen","Endklemme","Endkappen","Dachhaken L","Bieberschwanz Haken","Dachhaken Falzdach (kein Lager-Artikel)","Dachhaken Trapezblech (kein Lager-Artikel)"];
async function materiallisteNeu(c){
  const btn=$("#mlNeuBtn"); if(btn) btn.disabled=true;
  try{
    const r=await fetch(CONFIG.MAT_URL+"?action=liste&key="+CONFIG.MAT_KEY+"&b="+encodeURIComponent(c.id)+"&t="+Date.now(),{cache:"no-store"});
    const j=await r.json().catch(()=>null);
    if(!j||!j.ok){ alert("Für diese Baustelle ist kein Angebot aus dem PV-Konfigurator verknüpft (oder Make ist nicht erreichbar).\nDie Materialliste gibt es nur für Baustellen, die durch die Unterschrift eines Konfigurator-Angebots entstanden sind."); return; }
    const ml=j.zustand&&j.zustand.materialliste;
    if(!ml||!Array.isArray(ml.gesamt)||!ml.gesamt.length){ alert("Im Angebot "+(j.anzeige||j.nr)+" ist keine Materialliste gespeichert.\nIm PV-Konfigurator (ab v21) unter „Materialliste aus Belegungsplan“ erfassen und das Angebot neu speichern."); return; }
    const namen=new Set(MAT_ARTIKEL.concat(ml.gesamt.map(g=>g.artikel)));
    const gepackt={}, del=[]; let gepacktZeilen=0;
    c.materials.forEach(m=>{
      if(!namen.has(m.name)) return;
      if(m.gepackt){ gepacktZeilen++; gepackt[m.name]=(gepackt[m.name]||0)+(Number(m.benoetigt)||Number(m.outbound)||0); }
      else del.push(m.recId);
    });
    const neu=ml.gesamt.map(g=>({artikel:g.artikel, menge:Math.max(0,(Number(g.menge)||0)-(gepackt[g.artikel]||0))})).filter(g=>g.menge>0);
    const txt="Materialliste aus Angebot "+(j.anzeige||j.nr)+" neu übernehmen?\n\n"
      +"• "+del.length+" noch nicht gepackte Material-Zeile(n) werden ersetzt\n"
      +"• "+gepacktZeilen+" schon gepackte Zeile(n) bleiben – es kommt nur der Rest dazu\n"
      +"• "+neu.length+" Zeile(n) neu:\n"+neu.map(g=>"     "+g.menge+" × "+g.artikel).join("\n")
      +((ml.warnungen&&ml.warnungen.length)?"\n\n⚠️ Warnungen aus dem Konfigurator:\n"+ml.warnungen.join("\n"):"");
    if(!confirm(txt)) return;
    const fd=new FormData();
    fd.append("action","ersetzen"); fd.append("key",CONFIG.MAT_KEY); fd.append("b",c.id); fd.append("del",del.join(",")); fd.append("neu",JSON.stringify(neu));
    const r2=await fetch(CONFIG.MAT_URL,{method:"POST",body:fd});
    const j2=await r2.json().catch(()=>null);
    if(!j2||!j2.ok) throw new Error("Make hat die Übernahme nicht bestätigt");
    toast("Materialliste übernommen ✓");
    const id=c.id; await load(); openDetail(id);
  }catch(e){ toast("Fehler: "+e.message,true); }
  finally{ const b=$("#mlNeuBtn"); if(b) b.disabled=false; }
}

/* ===== Montageplan für den Monteur =====
   Datenquelle: im unterschriebenen Konfigurator-Angebot gespeicherte Materialliste (Make 9914877, Route liste).
   Gibt es keine, kann das Büro einen Belegungsplan hochladen → dieselbe KI-Erkennung wie im Konfigurator
   (Route starten/ergebnis) → Ergebnis zur Kontrolle (änderbar) → Zeichnung. Das geprüfte Ergebnis wird ZENTRAL
   an der Baustelle gespeichert (Airtable Baustellen „Montageplan (KI)“, Make 9914877 Route plan_speichern /
   plan_laden) – so sieht der Monteur denselben Plan auf seinem Handy.
   Strangnummern-Abgleich (wie Konfigurator ab v24): Anzahl gelesener Modulnummern ≠ gezählte Module → rote Warnung.
   Plausibilitätsprüfung hochkant/quer (wie Konfigurator ab v22) in der Kontrollansicht, mit „Reihen ↔ Spalten tauschen“.
   Rechenregeln wie PV-Konfigurator ab v23 (Länge, Schienen-Kombi mit kleinstem Rest, Haken = abrunden(L ÷ 2·Sparren) + 1).
   Montageregeln: Syrink-Firmenregeln (Ilias, 04.10.2026), Obsidian „05 Wissen/SL Rack Schrägdachsysteme 2026
   (Prospekt-Wissen).md“ › „Syrink-Montageregeln“: Stoß egal wo zwischen zwei Haken (Klemmung am Stoß erlaubt),
   Haken jeder 2. Sparren, Schienen 0–35 cm vom oberen/unteren Modulrand, Überstand 60 mm hinter der Endklemme,
   Innenverbinder 10 Nm. Liegt ein Stoß hinter dem letzten Haken (angenommene Sparrenlage) → gelber Hinweis. */
const MP_LAENGEN = [
  { mm:5850, t:"5,85 m", farbe:"#1565C0", fname:"blau" },
  { mm:4750, t:"4,75 m", farbe:"#2E7D32", fname:"grün" },
  { mm:3600, t:"3,6 m",  farbe:"#7B1FA2", fname:"lila" },
  { mm:2400, t:"2,4 m",  farbe:"#F9A825", fname:"gelb" }
];
const MP_FUGE = 20, MP_RAND = 60;
const MP_HAKEN = { "Ziegel":"Dachhaken L (Ziegel)", "Biberschwanz":"Bieberschwanz Haken", "Falz":"Dachhaken Falzdach", "Trapez":"Dachhaken Trapezblech" };
const MP_SCHIENE_MAX = 350, MP_NM = 10;   /* Schiene max. 35 cm vom Modulrand · Anzugsmoment Innenverbinder RAIL 2.0 */
const MP_REGELN = [
  "<b>Stoß / Innenverbinder:</b> egal wo zwischen zwei Dachhaken – Klemmung direkt am Stoß erlaubt (SL Rack Produktseite)",
  "<b>Dachhaken:</b> immer jeder 2. Sparren (RAIL 40)",
  "<b>Schienenlage:</b> 0–35 cm vom oberen bzw. unteren Modulrand (Maß in der Zeichnung)",
  "<b>Überstand:</b> 60 mm hinter der Endklemme",
  "<b>Innenverbinder RAIL 2.0:</b> Anzugsmoment " + MP_NM + " Nm, Torx 40, von beiden Seiten (SL-Rack-Produktblatt RAILs)"
];
const mpM = mm => (mm / 1000).toLocaleString("de-DE", { minimumFractionDigits:2, maximumFractionDigits:3 }) + " m";
const mpCm = mm => (Math.round(mm) / 10).toLocaleString("de-DE", { maximumFractionDigits:1 }) + " cm";
const mpL = mm => MP_LAENGEN.find(x => x.mm === mm);

const MP_KOMBI = {};
function mpKombi(L){
  if (MP_KOMBI[L]) return MP_KOMBI[L];
  const lim = MP_LAENGEN.map(s => Math.ceil(L / s.mm));
  let best = null;
  for (let a = 0; a <= lim[0]; a++) for (let b = 0; b <= lim[1]; b++) for (let c = 0; c <= lim[2]; c++) for (let d = 0; d <= lim[3]; d++) {
    const n = a + b + c + d; if (!n) continue;
    const summe = a * 5850 + b * 4750 + c * 3600 + d * 2400; if (summe < L) continue;
    const rest = summe - L;
    if (!best || rest < best.rest || (rest === best.rest && n < best.n)) best = { teile:[a, b, c, d], n, summe, rest };
  }
  return (MP_KOMBI[L] = best);
}
/* Eine Reihe: Länge, Stücke (lang → kurz), das kürzeste Stück wird um den Rest gekürzt, Haken je Schiene */
function mpReihe(n, breite, sparrenMm){
  const L = n * breite + (n - 1) * MP_FUGE + 2 * MP_RAND;
  const k = mpKombi(L), stuecke = [];
  MP_LAENGEN.forEach((s, i) => { for (let z = 0; z < k.teile[i]; z++) stuecke.push(s.mm); });
  const schnitt = k.rest > 0 ? { index:stuecke.length - 1, von:stuecke[stuecke.length - 1], auf:stuecke[stuecke.length - 1] - k.rest, ab:k.rest } : null;
  const haken = Math.floor(L / (2 * sparrenMm)) + 1, letzterHaken = (haken - 1) * 2 * sparrenMm, stossAussen = [];
  stuecke.slice(0, -1).reduce((p, mm) => { p += mm; if (p > letzterHaken) stossAussen.push(p); return p; }, 0);   /* Stoß muss zwischen zwei Haken liegen */
  return { n, L, k, stuecke, schnitt, haken, stossAussen };
}
function mpMasseAusKatalog(a){
  if (!a) return null;
  const t = String(a.langtext || ""), i = t.search(/abmessung/i);
  const m = (i >= 0 ? t.slice(i) : t).match(/(\d{3,4})\s*[x×]\s*(\d{3,4})(?:\s*[x×]\s*\d{1,3}(?:[.,]\d+)?)?\s*mm/i);
  if (!m) return null;
  const lang = Math.max(+m[1], +m[2]), kurz = Math.min(+m[1], +m[2]);
  return (lang < 900 || lang > 2800 || kurz < 600 || kurz > 1500) ? null : { lang, kurz };
}
let MP_KATALOG = null;
async function mpKatalog(){
  if (MP_KATALOG) return MP_KATALOG;
  const r = await fetch(CONFIG.KATALOG_URL, { cache:"no-store" });
  const j = await r.json();
  MP_KATALOG = ((j && j.katalog && j.katalog.records) || []).map(x => { const f = x.fields || {};
    return { id:x.id, name:f.fldZKRshSWTobcpm0 || "", kat:f.fldYWDj11G2im36KU || "", langtext:f.fldL9BQpZiZ8HIpjF || "" }; });
  return MP_KATALOG;
}

/* ---------- Plausibilität hochkant/quer (wie PV-Konfigurator ab v22) ----------
   Die KI misst im gesendeten Bild m = Breite/Höhe EINES Moduls und f = Breite/Höhe des ganzen Modulfelds.
   Passen die Seitenverhältnisse nicht zu Reihen/Spalten + Ausrichtung (Plan aufrecht ODER um 90° gedreht im Bild;
   Toleranz Modul Faktor 1,5 · Modulfeld Faktor 2) → rote Warnung „Plan evtl. gedreht“. */
function mpMessungAusKi(d, breite, hoehe){
  const ok = v => v > 0.05 && v < 20, fe = d.feld || {}, b = Number(fe.b), h = Number(fe.h);
  const m = Number(d.modul_bh), f = (b > 0 && b <= 1.05 && h > 0 && h <= 1.05 && breite > 0 && hoehe > 0) ? (b * breite) / (h * hoehe) : null;
  const out = {};
  if (ok(m)) out.m = Math.round(m * 1000) / 1000;
  if (ok(Number(f))) out.f = Math.round(f * 1000) / 1000;
  return (out.m || out.f) ? out : null;
}
/* Reihen ↔ Spalten tauschen (Module linksbündig gedacht): [2,2,2,2,2,2,2] → [7,7], [1,4,4] → [3,2,2,2] */
function mpTransponiert(reihen){
  const n = reihen.filter(x => x > 0), max = n.length ? Math.max.apply(null, n) : 0, out = [];
  for (let i = 0; i < max; i++) out.push(n.filter(x => x > i).length);
  return out.length ? out : [0];
}
function mpPlausi(d, masse){
  const mm = d.messung, n = d.reihen.filter(x => x > 0);
  if (!mm || !masse || !n.length) return null;
  const passt = (mess, soll, tol) => mess == null || Math.abs(Math.log(mess / soll)) <= Math.log(tol);
  const pruef = (reihen, ausr) => {
    const hk = ausr !== "quer", wRow = hk ? masse.kurz : masse.lang, hMod = hk ? masse.lang : masse.kurz;
    const pm = wRow / hMod, pf = (Math.max.apply(null, reihen) * wRow) / (reihen.length * hMod);
    return (passt(mm.m, pm, 1.5) && passt(mm.f, pf, 2)) || (passt(mm.m, 1 / pm, 1.5) && passt(mm.f, 1 / pf, 2));
  };
  if (pruef(n, d.ausrichtung)) return null;
  const t = mpTransponiert(n), anders = d.ausrichtung === "quer" ? "hochkant" : "quer";
  return { tausch: pruef(t, d.ausrichtung), ausrichtung: pruef(n, anders) ? anders : "", tauschVorschau: t };
}
function mpPlausiText(d, p){
  return "Plan evtl. gedreht – Reihen/Spalten prüfen! Die Seitenverhältnisse im Plan passen nicht zu " + d.reihen.filter(x => x > 0).length +
    " Reihe(n) mit bis zu " + Math.max.apply(null, d.reihen.concat([0])) + " Modulen " + d.ausrichtung + "." +
    (p.tausch ? " Mit „Reihen ↔ Spalten tauschen“ (" + p.tauschVorschau.join(" / ") + ") würde es passen." : "") +
    (p.ausrichtung && !p.tausch ? " Mit Ausrichtung „" + p.ausrichtung + "“ würde es passen." : "") +
    (!p.tausch && !p.ausrichtung ? " Bitte Reihen, Module je Reihe und Ausrichtung mit dem Plan vergleichen." : "");
}

/* ---------- Strangnummern-Abgleich (wie PV-Konfigurator v24) ---------- */
function mpNummernNorm(x){
  if (!Array.isArray(x)) return null;
  const out = [];
  x.forEach(n => { const t = String(n == null ? "" : n).replace(/\s+/g, "");
    if (/^[A-Za-z0-9][A-Za-z0-9.\-\/]{0,19}$/.test(t) && /\d/.test(t) && out.indexOf(t) < 0 && out.length < 400) out.push(t); });
  return out;
}
function mpNummernLuecken(nr){
  const gruppen = {}, out = [];
  nr.forEach(t => { const m = t.match(/^(.*\D)(\d+)$/); if (m) (gruppen[m[1]] = gruppen[m[1]] || []).push(+m[2]); });
  Object.keys(gruppen).sort().forEach(p => { const z = gruppen[p], max = Math.max.apply(null, z);
    if (max <= 60) for (let i = 1; i <= max; i++) if (z.indexOf(i) < 0) out.push(p + i); });
  return out;
}
/* null = passt (oder keine Nummern-Liste, z. B. Angebot vor v24 / von Hand) */
function mpStrang(d){
  if (!Array.isArray(d.nummern)) return null;
  const gezaehlt = (d.reihen || []).reduce((s, n) => s + (n > 0 ? n : 0), 0), gelesen = d.nummern.length;
  return gelesen === gezaehlt ? null : { gelesen, gezaehlt, luecken:mpNummernLuecken(d.nummern) };
}
function mpStrangText(s){
  return "Strangnummern-Abgleich: " + (s.gelesen ? s.gelesen + " Modulnummern im Plan gelesen" : "keine Modulnummern gelesen") + ", aber " + s.gezaehlt +
    " Module gezählt – Reihen mit dem Plan prüfen!" +
    (s.luecken.length ? " Lücke in der Nummernfolge: " + s.luecken.slice(0, 8).join(", ") + (s.luecken.length > 8 ? " …" : "") + "." : "");
}

/* ---------- Zeichnung (Draufsicht, maßstäblich in mm) ---------- */
function mpSvg(dach, masse, sparrenCm){
  const hk = dach.ausrichtung !== "quer", wRow = hk ? masse.kurz : masse.lang, hMod = hk ? masse.lang : masse.kurz;
  const S = sparrenCm * 10, rows = dach.reihen.filter(n => n > 0).map(n => mpReihe(n, wRow, S));
  const maxL = Math.max.apply(null, rows.map(r => r.L)), gap = 20, fs = Math.max(150, maxL / 55);
  const hoeheGes = rows.length * hMod + (rows.length - 1) * gap;
  const links = fs * 3.2, rechts = fs * 7, oben = fs * 4.4, unten = fs * 1.6;
  const vb = [-links, -oben, maxL + links + rechts, hoeheGes + oben + unten];
  let g = "";
  /* Maßstab 1 m */
  g += '<line x1="0" y1="' + (-oben + fs * 0.9) + '" x2="1000" y2="' + (-oben + fs * 0.9) + '" stroke="#0f172a" stroke-width="' + fs * 0.12 + '"/>' +
       '<text x="1080" y="' + (-oben + fs * 1.25) + '" font-size="' + fs + '" fill="#0f172a">1 m</text>';
  /* zuerst alle Module, darüber die Sparren, darüber Schienen, Verbinder, Schnitte, Haken */
  rows.forEach((r, i) => { const y0 = i * (hMod + gap);
    for (let j = 0; j < r.n; j++) g += '<rect x="' + (MP_RAND + j * (wRow + MP_FUGE)) + '" y="' + y0 + '" width="' + wRow + '" height="' + hMod + '" fill="#e2e8f0" stroke="#64748b" stroke-width="' + fs * 0.08 + '"/>'; });
  /* Sparren gestrichelt (Lage angenommen: erster Sparren am Schienenanfang) */
  for (let x = 0; x <= maxL + 1; x += S) g += '<line x1="' + x + '" y1="' + (-fs * 0.9) + '" x2="' + x + '" y2="' + (hoeheGes + fs * 0.4) + '" stroke="#475569" stroke-opacity="0.75" stroke-width="' + fs * 0.08 + '" stroke-dasharray="' + fs * 0.6 + ' ' + fs * 0.45 + '"/>';
  g += '<text x="0" y="' + (-fs * 1.4) + '" font-size="' + fs * 0.85 + '" fill="#475569">Sparren alle ' + sparrenCm + ' cm (gestrichelt, Lage angenommen)</text>';
  rows.forEach((r, i) => {
    const y0 = i * (hMod + gap);
    g += '<text x="' + (-links + fs * 0.3) + '" y="' + (y0 + hMod / 2 + fs * 0.35) + '" font-size="' + fs * 1.05 + '" font-weight="700" fill="#0f172a">R' + (i + 1) + '</text>';
    /* Schienenlage: so nah an ¼ Modulhöhe wie möglich, höchstens 35 cm vom Modulrand – Maß im ersten Modul */
    const ab = Math.min(hMod / 4, MP_SCHIENE_MAX), xm = MP_RAND + wRow / 2, sw = fs * 0.07, fm = Math.min(fs * 0.9, ab * 0.45);
    [[y0, y0 + ab], [y0 + hMod - ab, y0 + hMod]].forEach(([ya, yb]) => {
      g += '<line x1="' + xm + '" y1="' + ya + '" x2="' + xm + '" y2="' + yb + '" stroke="#b45309" stroke-width="' + sw + '"/>' +
           '<line x1="' + (xm - fs * 0.3) + '" y1="' + ya + '" x2="' + (xm + fs * 0.3) + '" y2="' + ya + '" stroke="#b45309" stroke-width="' + sw + '"/>' +
           '<line x1="' + (xm - fs * 0.3) + '" y1="' + yb + '" x2="' + (xm + fs * 0.3) + '" y2="' + yb + '" stroke="#b45309" stroke-width="' + sw + '"/>' +
           '<text x="' + (xm + fs * 0.4) + '" y="' + ((ya + yb) / 2 + fm * 0.36) + '" font-size="' + fm + '" font-weight="700" fill="#b45309">0–35 cm</text>';
    });
    [ab, hMod - ab].forEach(dy => {
      const y = y0 + dy, dick = fs * 0.45;
      let x = 0;
      r.stuecke.forEach((mm, si) => {
        const len = (r.schnitt && si === r.schnitt.index) ? r.schnitt.auf : mm;
        g += '<rect x="' + x + '" y="' + (y - dick / 2) + '" width="' + len + '" height="' + dick + '" fill="' + mpL(mm).farbe + '" stroke="#0f172a" stroke-width="' + fs * 0.04 + '"/>';
        x += len;
        if (si < r.stuecke.length - 1) g += '<rect x="' + (x - fs * 0.5) + '" y="' + (y - dick) + '" width="' + fs + '" height="' + dick * 2 + '" fill="#dc2626"/>';   /* Verbinder */
      });
      if (r.schnitt) g += '<line x1="' + r.L + '" y1="' + (y - dick * 1.6) + '" x2="' + r.L + '" y2="' + (y + dick * 1.6) + '" stroke="#dc2626" stroke-width="' + fs * 0.22 + '"/>';   /* Schnitt */
      for (let h = 0; h < r.haken; h++) g += '<circle cx="' + (h * 2 * S) + '" cy="' + y + '" r="' + fs * 0.42 + '" fill="#0f172a" stroke="#fff" stroke-width="' + fs * 0.08 + '"/>';
    });
    g += '<text x="' + (maxL + fs * 0.6) + '" y="' + (y0 + hMod / 2 - fs * 0.2) + '" font-size="' + fs + '" font-weight="700" fill="#0f172a">' + r.n + ' Module</text>' +
         '<text x="' + (maxL + fs * 0.6) + '" y="' + (y0 + hMod / 2 + fs * 1.1) + '" font-size="' + fs + '" fill="#1565C0" font-weight="700">' + mpM(r.L) + '</text>';
  });
  return { svg:'<svg viewBox="' + vb.join(" ") + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Montageplan ' + esc(dach.name || "") + '">' + g + '</svg>', rows };
}

/* ---------- Liste je Dachfläche / gesamt ---------- */
function mpZaehlen(rows, dachart){
  const z = { laengen:{}, schnitte:{}, verb:0, mk:0, ek:0, kap:0, haken:0, hakenTyp:{} };
  rows.forEach(r => {
    r.stuecke.forEach(mm => { z.laengen[mm] = (z.laengen[mm] || 0) + 2; });
    if (r.schnitt) { const key = r.schnitt.von + "|" + r.schnitt.auf; z.schnitte[key] = (z.schnitte[key] || 0) + 2; }
    z.verb += 2 * (r.stuecke.length - 1); z.mk += (r.n - 1) * 2; z.ek += 4; z.kap += 4; z.haken += 2 * r.haken;
    z.hakenTyp[dachart] = (z.hakenTyp[dachart] || 0) + 2 * r.haken;
  });
  return z;
}
function mpAddiere(a, b){
  Object.keys(b.laengen).forEach(k => a.laengen[k] = (a.laengen[k] || 0) + b.laengen[k]);
  Object.keys(b.schnitte).forEach(k => a.schnitte[k] = (a.schnitte[k] || 0) + b.schnitte[k]);
  ["verb", "mk", "ek", "kap", "haken"].forEach(k => a[k] += b[k]);
  Object.keys(b.hakenTyp).forEach(k => a.hakenTyp[k] = (a.hakenTyp[k] || 0) + b.hakenTyp[k]);
  return a;
}

function mpZuschnittJeSchiene(rows){

/* ---------- Gesamtansicht ---------- */

/* ---------- KI-Erkennung (wie PV-Konfigurator v23) ---------- */
let mpPdfjs = null;
function mpPdf(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (!mpPdfjs) mpPdfjs = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(window.pdfjsLib); };
    s.onerror = () => { mpPdfjs = null; rej(new Error("PDF-Leser konnte nicht geladen werden")); }; document.head.appendChild(s); });
  return mpPdfjs;
}
function mpLeinwand(w, h){ const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); return c; }
async function mpSeiten(blob, istPdf){
  if (istPdf) {
    const lib = await mpPdf(), pdf = await lib.getDocument({ data:await blob.arrayBuffer() }).promise, out = [];
    for (let n = 1; n <= Math.min(pdf.numPages, 4); n++) {
      const pg = await pdf.getPage(n), v1 = pg.getViewport({ scale:1 }), vp = pg.getViewport({ scale:Math.min(5, 2000 / Math.max(v1.width, v1.height)) });
      const c = mpLeinwand(vp.width, vp.height);
      await pg.render({ canvasContext:c.getContext("2d"), viewport:vp, intent:"print" }).promise;   /* läuft auch im verdeckten Tab */
      out.push(c);
    }
    return out;
  }
  return [await new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(blob);
    img.onload = () => { const f = Math.min(1, 2000 / Math.max(img.width, img.height)), c = mpLeinwand(img.width * f, img.height * f); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Bild konnte nicht geöffnet werden")); }; img.src = url; })];
}
function mpDrehen(cv, grad){
  const quer = grad % 180 !== 0, c = mpLeinwand(quer ? cv.height : cv.width, quer ? cv.width : cv.height), x = c.getContext("2d");
  x.translate(c.width / 2, c.height / 2); x.rotate(grad * Math.PI / 180); x.drawImage(cv, -cv.width / 2, -cv.height / 2); return c;
}
const mpPause = ms => new Promise(r => setTimeout(r, ms));
async function mpKi(cv, aufgerichtet, zeige){
  const job = "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10), fd = new FormData();
  fd.append("action", "starten"); fd.append("key", CONFIG.MAT_KEY); fd.append("job", job); fd.append("gedreht", aufgerichtet ? "1" : "0"); fd.append("bild", cv.toDataURL("image/jpeg", 0.85));
  const st = await fetch(CONFIG.MAT_URL, { method:"POST", body:fd }).then(r => r.json());
  if (!st || st.ok !== 1) throw new Error("KI-Auftrag konnte nicht gestartet werden");
  const t0 = Date.now(); await mpPause(8000);
  while (Date.now() - t0 < 240000) {
    zeige(Math.round((Date.now() - t0) / 1000));
    let j = null;
    try { const txt = await fetch(CONFIG.MAT_URL + "?action=ergebnis&key=" + CONFIG.MAT_KEY + "&job=" + job + "&t=" + Date.now(), { cache:"no-store" }).then(r => r.text());
          try { j = JSON.parse(txt); } catch(e) { if (txt) throw new Error("KI-Ergebnis war nicht lesbar – bitte nochmal versuchen"); } }
    catch(e) { if (/nicht lesbar/.test(e.message)) throw e; }
    if (j && j.fertig) { if (j.ok !== 1) throw new Error(j.fehler || "KI-Erkennung fehlgeschlagen"); return j.ergebnis; }
    await mpPause(4000);
  }
  throw new Error("Die KI hat nach 4 Minuten noch kein Ergebnis geliefert");
}
async function mpAuswerten(c, blob, name){
  const ki = $("#mpKi"), status = (cls, t) => { ki.innerHTML = '<div class="' + (cls === "fehler" ? "mp-warn" : "mp-info") + '">' + t + '</div>'; };
  try {
    status("", "⏳ <b>" + esc(name) + "</b> wird gelesen …");
    const istPdf = /\.pdf$/i.test(name) || blob.type === "application/pdf", seiten = await mpSeiten(blob, istPdf);
    const daecher = [], ohne = []; let vorschau = "", gedreht = 0;
    for (let i = 0; i < seiten.length; i++) {
      const s = seiten.length > 1 ? " (Seite " + (i + 1) + "/" + seiten.length + ")" : "";
      let cv = seiten[i], j = await mpKi(cv, false, sek => status("", "🤖 KI liest den Belegungsplan" + s + " … " + sek + " s"));
      if (j.modulnummern === false) { ohne.push(i + 1); continue; }
      const dreh = [90, 180, 270].indexOf(Number(j.drehung)) >= 0 ? Number(j.drehung) : 0;
      if (dreh) { gedreht = dreh; cv = mpDrehen(cv, dreh); j = await mpKi(cv, true, sek => status("", "🔄 Plan um " + dreh + "° gedreht – wird aufgerichtet und neu gelesen" + s + " … " + sek + " s")); }
      if (!vorschau) vorschau = cv.toDataURL("image/jpeg", 0.7);
      (j.daecher || []).forEach(d => daecher.push({ name:String(d.name || "Dachfläche " + (daecher.length + 1)), ausrichtung:/quer/i.test(d.ausrichtung) ? "quer" : "hochkant", dachart:"Ziegel",
        reihen:(d.reihen || []).map(x => Math.max(0, Math.round(Number(x) || 0))).filter(x => x > 0), nummern:mpNummernNorm(d.nummern),
        messung:mpMessungAusKi(d, cv.width, cv.height) }));
    }
    if (!daecher.length) { status("fehler", ohne.length ? "⛔ <b>Bitte Strangplan-Seite aus PV*SOL hochladen.</b> In diesem Plan sind keine Modulnummern erkennbar – es wurde nichts gezählt." : "⛔ Im Plan wurden keine Module erkannt."); return; }
    const kat = await mpKatalog(), module = kat.filter(a => a.kat === "Modul" && mpMasseAusKatalog(a));
    mpKontrolle(c, { daecher, vorschau, gedreht, module, datei:name });
  } catch(e) { status("fehler", "⛔ Belegungsplan konnte nicht ausgewertet werden: " + esc(e.message)); }
}
/* Ergebnis zur Kontrolle: Reihen, Ausrichtung, Dachart, Modul, Sparren änderbar → Zeichnung */
function mpKontrolle(c, k){
  const ki = $("#mpKi");
  ki.innerHTML = '<div class="mp-info mp-ok">✅ <b>KI-Ergebnis zur Kontrolle</b> – bitte mit dem Plan vergleichen und bei Bedarf ändern, dann „Montageplan zeichnen“.' + (k.gedreht ? ' Plan war um ' + k.gedreht + '° gedreht und wurde aufgerichtet.' : '') + '</div>' +
    '<div class="mp-kontrolle"><label>Modul<select id="mpModul">' + k.module.map(a => '<option value="' + a.id + '">' + esc(a.name) + '</option>').join("") + '</select></label>' +
    '<label>Sparrenabstand (cm)<input id="mpSparren" type="number" min="30" max="150" value="65" style="width:90px"></label></div>' +
    k.daecher.map((d, i) => '<div class="mp-kontrolle" data-mpd="' + i + '"><label>Dachfläche<input data-f="name" value="' + esc(d.name) + '"></label>' +
      '<label>Module je Reihe (Komma)<input class="mp-reihen" data-f="reihen" value="' + d.reihen.join(", ") + '"></label>' +
      '<label>Ausrichtung<select data-f="ausrichtung"><option' + (d.ausrichtung === "hochkant" ? " selected" : "") + '>hochkant</option><option' + (d.ausrichtung === "quer" ? " selected" : "") + '>quer</option></select></label>' +
      '<label>Dachart<select data-f="dachart">' + Object.keys(MP_HAKEN).map(t => '<option>' + t + '</option>').join("") + '</select></label></div>' +
      '<div data-mpplausi="' + i + '"></div><div data-mpstrang="' + i + '"></div>').join("") +
    '<button class="btn primary" type="button" id="mpZeichnen">📐 Montageplan zeichnen und an der Baustelle speichern</button>' +
    (k.vorschau ? '<details class="mp-vorschau" open><summary><b>Plan zum Vergleichen</b></summary><img src="' + k.vorschau + '" alt="Belegungsplan"></details>' : '');
  const reihenAus = row => row.querySelector('[data-f="reihen"]').value.split(/[^0-9]+/).map(Number).filter(n => n > 0);
  const strangLive = () => ki.querySelectorAll("[data-mpd]").forEach(row => {
    const i = +row.dataset.mpd, st = mpStrang({ reihen:reihenAus(row), nummern:k.daecher[i].nummern }), box = ki.querySelector('[data-mpstrang="' + i + '"]');
    if (box) box.innerHTML = st ? '<div class="mp-warn" style="margin:0 0 10px">⛔ ' + esc(mpStrangText(st)) + '</div>' :
      (Array.isArray(k.daecher[i].nummern) ? '<div class="mp-info mp-ok" style="margin:0 0 10px">✓ Strangnummern-Abgleich: ' + k.daecher[i].nummern.length + ' Nummern gelesen = ' + reihenAus(row).reduce((a, n) => a + n, 0) + ' Module gezählt</div>' : '');
  });
  const plausiLive = () => {
    const masse = mpMasseAusKatalog(k.module.find(a => a.id === $("#mpModul").value));
    ki.querySelectorAll("[data-mpd]").forEach(row => {
      const i = +row.dataset.mpd, box = ki.querySelector('[data-mpplausi="' + i + '"]'); if (!box) return;
      const d = { reihen:reihenAus(row), ausrichtung:row.querySelector('[data-f="ausrichtung"]').value, messung:k.daecher[i].messung }, p = mpPlausi(d, masse);
      box.innerHTML = p ? '<div class="mp-warn" style="margin:0 0 10px">⛔ ' + esc(mpPlausiText(d, p)) +
        (p.tausch ? '<br><button class="btn" type="button" data-mp-tausch="' + i + '" style="margin-top:8px">↻ Jetzt Reihen ↔ Spalten tauschen</button>' : '') + '</div>' : '';
    });
  };
  const pruefenLive = () => { plausiLive(); strangLive(); };
  ki.oninput = pruefenLive; pruefenLive();
  ki.onclick = e => {
    const t = e.target.closest("[data-mp-tausch]"); if (!t) return;
    const row = ki.querySelector('[data-mpd="' + t.dataset.mpTausch + '"]'); if (!row) return;
    row.querySelector('[data-f="reihen"]').value = mpTransponiert(reihenAus(row)).join(", ");
    pruefenLive();
  };
  $("#mpZeichnen").onclick = async () => {
    const rein = t => String(t == null ? "" : t).replace(/[<>]/g, "").trim().slice(0, 80);   /* keine spitzen Klammern ins zentrale Feld */
    const ml = { sparren:Number($("#mpSparren").value) || 65, daecher:[...ki.querySelectorAll("[data-mpd]")].map(row => { const i = +row.dataset.mpd; return {
      name:rein(row.querySelector('[data-f="name"]').value) || "Dachfläche " + (i + 1), ausrichtung:row.querySelector('[data-f="ausrichtung"]').value, dachart:row.querySelector('[data-f="dachart"]').value,
      reihen:reihenAus(row), nummern:k.daecher[i].nummern || null }; }) };
    const modul = k.module.find(a => a.id === $("#mpModul").value), masse = mpMasseAusKatalog(modul);
    if (!masse) { toast("Für dieses Modul fehlen die Maße im PV-Katalog", true); return; }
    const p = { v:1, ml, masse, sparren:ml.sparren, modulId:modul.id, modulName:rein(modul.name), datum:new Date().toLocaleDateString("de-DE"), datei:rein(k.datei), gedreht:k.gedreht || 0 };
    const btn = $("#mpZeichnen"); btn.disabled = true; btn.textContent = "⏳ wird an der Baustelle gespeichert …";
    let fehler = "";
    try { await mpPlanSpeichern(c, p); } catch(e) { fehler = e.message; }
    if (state.openId !== c.id) return;   /* inzwischen andere Baustelle geöffnet */
    mpZeichnen($("#mpBody"), ml, masse, ml.sparren, fehler ? "KI-Erkennung aus „" + p.datei + "“ – NICHT gespeichert" : mpPlanQuelle(p));
    if (fehler) { MP_OFFEN = { id:c.id, p };
      $("#mpBody").insertAdjacentHTML("afterbegin", '<div class="mp-warn">⛔ Montageplan konnte NICHT an der Baustelle gespeichert werden (' + esc(fehler) + ') – der Monteur sieht ihn so noch nicht. <button class="btn" type="button" data-mp-retry>Nochmal speichern</button></div>'); }
    else toast("Montageplan an der Baustelle gespeichert ✓");
    $("#mpBody").insertAdjacentHTML("beforeend", mpUploadHtml(c, true));
  };
}
/* Klicks im Montageplan-Bereich */
document.addEventListener("click", async e => {
  const c = state.customers.find(x => x.id === state.openId); if (!c) return;
  if (e.target.closest("#mpBtn")) { mpOeffnen(c); return; }
  if (e.target.closest("[data-mp-upload]")) { $("#mpDatei").click(); return; }
  if (e.target.closest("[data-mp-retry]")) {
    if (!MP_OFFEN || MP_OFFEN.id !== c.id) return;
    try { await mpPlanSpeichern(c, MP_OFFEN.p); MP_OFFEN = null; toast("Montageplan an der Baustelle gespeichert ✓"); mpOeffnen(c); }
    catch(err) { toast("Fehler: " + err.message, true); }
    return;
  }
  if (e.target.closest("[data-mp-plan]")) {
    try { const b = await fetch(c.plan.url).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.blob(); }); mpAuswerten(c, b, c.plan.name || "Belegungsplan"); }
    catch(err) { $("#mpKi").innerHTML = '<div class="mp-warn">⛔ Belegungsplan aus Airtable konnte nicht geladen werden (' + esc(err.message) + ') – bitte die Datei mit „Belegungsplan hochladen“ wählen.</div>'; }
  }
});
document.addEventListener("change", e => {
  if (e.target.id !== "mpDatei") return;
  const c = state.customers.find(x => x.id === state.openId), f = e.target.files && e.target.files[0]; e.target.value = "";
  if (c && f) mpAuswerten(c, f, f.name);
});

/* ===== Speichern (Beacon) ===== */
const timers={};
function q(v){ return v===""||v==null?"":v; }
function saveMaterial(m,f){
  clearTimeout(timers[m.recId]);
  const buero = f==="benoetigt";
  timers[m.recId]=setTimeout(()=>{
    const u = buero
      ? CONFIG.SAVE_URL+"?kind=matB&id="+encodeURIComponent(m.recId)+"&benoetigt="+q(m.benoetigt)
      : CONFIG.SAVE_URL+"?kind=matM&id="+encodeURIComponent(m.recId)+"&outbound="+q(m.outbound)+"&inbound="+q(m.inbound)+"&gepackt="+(m.gepackt?"true":"false");
    beacon(u);
  },600);
}
function saveStatus(c){ beacon(CONFIG.SAVE_URL+"?kind=site&id="+encodeURIComponent(c.id)+"&status="+encodeURIComponent(c.status)); }
function toggleFreigabe(c){
  c.released=!c.released;
  beacon(CONFIG.SAVE_URL+"?kind=freigabe&id="+encodeURIComponent(c.id)+"&freigabe="+(c.released?"true":"false"));
  toast(c.released?"Für Mitarbeiter freigegeben ✓":"Freigabe zurückgenommen");
  if($("#detail").style.display==="block") renderDetail(); else renderDashboard();
}

/* ===== Teilen ===== */
let shareCtx=null;
function shareText(c){
  const link=CONFIG.PLAN_URL+"?b="+encodeURIComponent(c.id);
  let txt="Belegungsplan für "+c.name;
  if(c.address){
    txt+="\n📍 Adresse: "+c.address;
    txt+="\n🗺️ Navigation: "+mapsUrl(c.address);
  }
  if(c.date) txt+="\n📅 Termin: "+c.date;
  txt+="\n\n📄 Belegungsplan: "+link;
  return txt;
}
function openShare(e,c){ shareCtx=c; const p=$("#sharePop"); const r=e.currentTarget.getBoundingClientRect(); p.style.display="block"; p.style.left=Math.min(r.left,window.innerWidth-210)+"px"; p.style.top=(r.bottom+window.scrollY+6)+"px"; }
document.addEventListener("click",e=>{ const p=$("#sharePop"); if(p.style.display==="block"&&!p.contains(e.target)&&!e.target.closest("#shareBtn"))p.style.display="none"; });
$("#sharePop").querySelectorAll("button").forEach(b=>{
  b.onclick=()=>{ const c=shareCtx; const txt=shareText(c);
    if(b.dataset.a==="wa"){ window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank"); }
    else { navigator.clipboard&&navigator.clipboard.writeText(txt); toast("Plan + Adresse kopiert"); }
    $("#sharePop").style.display="none";
  };
});

/* ===== Rolle / Navigation ===== */
$("#role").querySelectorAll("button").forEach(b=>{ b.onclick=()=>{ state.role=b.dataset.r; $("#role").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b)); if($("#detail").style.display==="block") renderDetail(); }; });
$("#backBtn").onclick=()=>{ $("#detail").style.display="none"; $("#dashboard").classList.remove("hide"); renderDashboard(); };
$("#reloadBtn").onclick=load;
$("#logoutBtn").onclick=()=>{ sessionStorage.removeItem("bz_access"); location.reload(); };
$("#searchIn").addEventListener("input",e=>{ state.search=e.target.value; $("#searchClear").classList.toggle("hide",!e.target.value); if($("#detail").style.display!=="block") renderDashboard(); });
$("#searchClear").onclick=()=>{ state.search=""; $("#searchIn").value=""; $("#searchClear").classList.add("hide"); renderDashboard(); };

/* ===== Access-UI ===== */
function applyAccessUI(){
  const admin=state.access==="admin";
  $("#role").classList.toggle("hide",!admin);
  $("#role").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.r===state.role));
  const badge=$("#accessBadge"); badge.textContent=admin?"Admin":"Mitarbeiter"; badge.className="badge-role "+(admin?"adm":"mit");
  $("#pageTitle").textContent=admin?"Zentrale":"Zu packen";
  $("#pageSub").textContent=admin?"Pro gewonnenem Kunden eine Karte":"Von deinem Chef für die Baustelle freigegeben";
}

/* ===== Gate ===== */
function startApp(access){
  state.access=access; state.role = access==="admin" ? "buero" : "mitarbeiter";
  sessionStorage.setItem("bz_access",access);
  $("#gate").classList.add("hide"); $("#app").classList.remove("hide");
  applyAccessUI(); load();
}
function unlock(){
  const v=$("#codeIn").value.trim();
  if(v===CONFIG.CODE_ADMIN){ startApp("admin"); }
  else if(v===CONFIG.CODE_MIT){ startApp("mit"); }
  else { $("#codeErr").textContent="Falscher Code."; $("#codeIn").value=""; }
}
$("#codeBtn").onclick=unlock;
$("#codeIn").addEventListener("keydown",e=>{ if(e.key==="Enter") unlock(); });
const saved=sessionStorage.getItem("bz_access");
if(saved==="admin"||saved==="mit") startApp(saved);
</script>
</body>
</html>
